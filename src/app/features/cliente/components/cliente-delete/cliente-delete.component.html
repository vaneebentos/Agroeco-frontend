@if (cliente) {
  <div class="confirmacion">
    <h3>Eliminar cliente</h3>

    <p>
      ¿Estás seguro de que deseas eliminar a
      <strong>{{ cliente.nombre }}</strong>?
    </p>

    <button (click)="confirmarEliminacion()">
      Confirmar
    </button>

    <button (click)="cancelarEliminacion()">
      Cancelar
    </button>
  </div>
}
