@if (mensajeExito) {
  <p>{{ mensajeExito }}</p>
}

<div class="pagina-header">
  <div class="pagina-titulo">
    <h1>Gestión de clientes</h1>
    <span>Administrá, consultá y gestioná los clientes registrados en AgroEco.</span>
  </div>

  <button type="button" (click)="abrirCrearCliente()">
    <span class="material-symbols-outlined">person_add</span>
    Nuevo cliente
  </button>
</div>

<div class="listado-header">
  <div>
    <h2>Listado de clientes</h2>
    <span>Consultá la información de los clientes registrados.</span>
  </div>

  <div class="buscador">
    <input
      type="text"
      placeholder="Buscar por nombre, email o CUIT..."
      [value]="terminoBusqueda"
      (input)="buscarClientes($any($event.target).value)"
    />
  </div>
</div>

<app-tabla
  [columnas]="columnas"
  [datos]="clientes"
  (editar)="editarCliente($event)"
  (eliminar)="eliminarCliente($event)"
></app-tabla>
<app-modal
  [abierto]="modalAbierto"
  [titulo]="tipoModal === 'formulario'
    ? (clienteSeleccionado ? 'Editar cliente' : 'Nuevo cliente')
    : 'Eliminar cliente'"
  (cerrar)="cerrarModal()"
>

  @if (tipoModal === 'formulario') {
    <app-cliente-form
      [cliente]="clienteSeleccionado"
      [errorServidor]="errorServidor"
      (guardar)="guardarCliente($event)"
      (cancelar)="cerrarModal()"
    />
  }

  @if (tipoModal === 'eliminar') {
    <app-cliente-delete
      [cliente]="clienteAEliminar"
      (confirmar)="confirmarEliminacion($event)"
      (cancelar)="cerrarModal()"
    />
  }

</app-modal>
