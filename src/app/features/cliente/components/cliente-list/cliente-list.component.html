
@if (mensajeExito) {
  <p>{{ mensajeExito }}</p>
}

<button type="button" (click)="abrirCrearCliente()">
  Nuevo cliente
</button>

<app-tabla
  [columnas]="columnas"
  [datos]="clientes"
  (editar)="editarCliente($event)"
  (eliminar)="eliminarCliente($event)"
></app-tabla>

<app-modal
  [abierto]="modalAbierto"
  [titulo]="tipoModal === 'formulario'
    ? (clienteSeleccionado ? 'Editar cliente' : 'Nuevo cliente')
    : 'Eliminar cliente'"
  (cerrar)="cerrarModal()"
>

  @if (tipoModal === 'formulario') {
    <app-cliente-form
      [cliente]="clienteSeleccionado"
      [errorServidor]="errorServidor"
      (guardar)="guardarCliente($event)"
      (cancelar)="cerrarModal()"
    />
  }

  @if (tipoModal === 'eliminar') {
    <app-cliente-delete
      [cliente]="clienteAEliminar"
      (confirmar)="confirmarEliminacion($event)"
      (cancelar)="cerrarModal()"
    />
  }

</app-modal>
