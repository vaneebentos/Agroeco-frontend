<header class="lehmann-header">
  <div class="header-container">
    <!-- Logo Estilo Institucional -->
    <a routerLink="/semillas" class="brand-box">
      <div class="brand-logo-icon">
        <span class="material-symbols-outlined">agriculture</span>
      </div>
      <div class="brand-titles">
        <span class="brand-main">AGROECO</span>
        <span class="brand-sub">Semillas &amp; Insumos</span>
      </div>
    </a>

    <!-- Barra central en píldora blanca (Estilo Lehmann) -->
    <nav class="nav-pill-bar">
      <a routerLink="/semillas" routerLinkActive="active" class="nav-pill-link">Catálogo de Semillas</a>
      <a routerLink="/clientes" routerLinkActive="active" class="nav-pill-link">Clientes</a>
      <a routerLink="/cotizacion" routerLinkActive="active" class="nav-pill-link">Cotizaciones</a>
      <a routerLink="/clima" routerLinkActive="active" class="nav-pill-link">Clima</a>
    </nav>

    <!-- Píldoras derechas: Clima + Cuenta Corriente + Carrito (Estilo Lehmann + LG) -->
    <div class="header-pills-right">
      <!-- Botón de Clima (va al historial de lluvia, viento y granizo) -->
      <a routerLink="/clima" routerLinkActive="active-pill" class="info-pill weather-pill" title="Ver historial de lluvia, viento y granizo">
        <span class="material-symbols-outlined weather-icon">partly_cloudy_day</span>
        <div class="pill-text-group">
          <span class="pill-top">Zona Centro</span>
          <span class="pill-bottom"><strong>21.6°</strong> <small>Lluvia / Viento</small></span>
        </div>
      </a>

      <!-- Botón de Cuenta Corriente / Login clientes habituales -->
      <a routerLink="/cuenta-corriente" routerLinkActive="active-pill" class="info-pill cc-pill" title="Acceso clientes habituales: compras, rindes y asistencia">
        <span class="material-symbols-outlined cc-icon">account_balance_wallet</span>
        <div class="pill-text-group">
          <span class="pill-brand">MiAgroEco</span>
          <span class="pill-sub">Cuenta corriente</span>
        </div>
      </a>

      <!-- Botón Carrito / Pedir Cotización -->
      <a routerLink="/cotizacion" class="cotizar-pill-btn">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="btn-label">Cotizar</span>
        <span class="cart-badge" *ngIf="cotizacionService.count() > 0">{{ cotizacionService.count() }}</span>
      </a>
    </div>
  </div>
</header>
