<header class="header notranslate" translate="no">
  <div class="header-content">
    <a routerLink="/" class="brand">
      <div class="brand-icon">
        <span class="material-symbols-outlined notranslate" translate="no">eco</span>
      </div>
      <span class="brand-text">AgroEco</span>
    </a>

    <!-- CUSTOMER VIEW ACTIONS -->
    <div class="actions" *ngIf="!isAdminMode">
      <button class="icon-btn text-size-btn" (click)="toggleLargeText()"
        [title]="isLargeText ? 'Tamaño de letra normal' : 'Aumentar tamaño de letra'">
        T
      </button>

      <button class="icon-btn contrast-btn" (click)="toggleHighContrast()"
        [title]="isHighContrast ? 'Modo estándar' : 'Modo alto contraste'">
        <span class="material-symbols-outlined notranslate" translate="no">contrast</span>
      </button>

      <a routerLink="/cotizacion" class="cotizar-btn">
        <span class="material-symbols-outlined cart-icon notranslate" translate="no">shopping_cart</span>
        <span class="btn-text">Pedir cotización</span>
        <span class="cart-badge" *ngIf="quoteService.count() > 0">{{ quoteService.count() }}</span>
      </a>
    </div>


    <!-- ADMIN VIEW ACTIONS (/admin/panel) -->
    <div class="actions" *ngIf="isAdminMode">
      <a routerLink="/admin/panel" class="header-admin-new-btn">
        <span class="material-symbols-outlined notranslate" translate="no">spa</span>
        <span>Semillas</span>
      </a>

      <a routerLink="/admin/panel/clientes" class="header-admin-new-btn">
        <span class="material-symbols-outlined notranslate" translate="no">groups</span>
        <span>Clientes</span>
      </a>

      <a routerLink="/" class="header-admin-client-btn">
        <span class="material-symbols-outlined notranslate" translate="no">visibility</span>
        <span>Ver como Cliente</span>
      </a>
    </div>
  </div>
  <div class="brand-stripe"></div>
</header>
