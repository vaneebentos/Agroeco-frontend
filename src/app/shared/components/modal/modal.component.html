
@if (open) {
  <div class="modal-overlay" (click)="closeModal()">

    <div
      class="modal-contenido"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h2>{{ title }}</h2>

        <button
          type="button"
          class="btn-cerrar"
          (click)="closeModal()"
          aria-label="Cerrar modal"
        >
          &times;
        </button>
      </div>

      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>

  </div>
}
